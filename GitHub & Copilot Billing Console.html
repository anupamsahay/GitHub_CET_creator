<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitHub &amp; Copilot Billing Console</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f8fa; --surface:#ffffff; --surface-2:#f0f3f6; --surface-3:#e7edf3;
  --ink:#1c2128; --ink-2:#57606a; --ink-3:#8b949e;
  --line:#d4dae0; --line-2:#e5e9ed;
  --accent:#0969da; --accent-ink:#ffffff;
  --good:#1a7f37; --good-bg:#dafbe1;
  --warn:#9a6700; --warn-bg:#fff8c5;
  --bad:#cf222e;  --bad-bg:#ffebe9;
  --oit:#6639ba;  --oit-bg:#f0e8ff;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d1117; --surface:#161b22; --surface-2:#1c2330; --surface-3:#222b38;
    --ink:#e6edf3; --ink-2:#9198a1; --ink-3:#6e7681;
    --line:#30363d; --line-2:#262c34;
    --accent:#4493f8; --accent-ink:#0d1117;
    --good:#3fb950; --good-bg:#12261a;
    --warn:#d29922; --warn-bg:#2b2412;
    --bad:#f85149;  --bad-bg:#2d1618;
    --oit:#a371f7;  --oit-bg:#231a35;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1117; --surface:#161b22; --surface-2:#1c2330; --surface-3:#222b38;
  --ink:#e6edf3; --ink-2:#9198a1; --ink-3:#6e7681;
  --line:#30363d; --line-2:#262c34;
  --accent:#4493f8; --accent-ink:#0d1117;
  --good:#3fb950; --good-bg:#12261a;
  --warn:#d29922; --warn-bg:#2b2412;
  --bad:#f85149;  --bad-bg:#2d1618;
  --oit:#a371f7;  --oit-bg:#231a35;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top: env(safe-area-inset-top, 0px); height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  background:var(--surface);z-index:40}

/* ---------- shell ---------- */
header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.top-in{max-width:1480px;margin:0 auto;padding:14px 20px 0;display:flex;flex-wrap:wrap;
  align-items:flex-start;gap:16px}
.brand h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--ink-2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

nav.tabs{max-width:1480px;margin:0 auto;padding:10px 20px 0;display:flex;gap:2px;

nav.tabs button{
  appearance:none;border:0;background:transparent;color:var(--ink-2);
  font:inherit;font-size:13px;padding:9px 13px;border-radius:7px 7px 0 0;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;
}
nav.tabs button:hover{color:var(--ink);background:var(--surface-2)}

main{max-width:1480px;margin:0 auto;padding:20px 20px 60px}
.panel[hidden]{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;margin-bottom:16px}

.card > .sub{margin:0 0 14px;font-size:12px;color:var(--ink-2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}

.tile .val{font-size:25px;font-weight:650;font-family:var(--mono);margin:7px 0 2px;
  letter-spacing:-.02em;line-height:1.1}
.tile .cap{font-size:11.5px;color:var(--ink-3)}
.tile.good{border-left:3px solid var(--good)}
.tile.warn{border-left:3px solid var(--warn)}
.tile.bad{border-left:3px solid var(--bad)}
.tile.oit{border-left:3px solid var(--oit)}

.banner.good{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.banner .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.banner small{font-weight:400;opacity:.85;margin-left:auto;font-size:12px;text-align:right}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
thead th{background:var(--surface-3);font-size:11px;text-transform:uppercase;

tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.total td{font-weight:650;background:var(--surface-2);border-top:2px solid var(--line)}
tr.oitrow td:first-child{box-shadow:inset 3px 0 0 var(--oit)}

.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--ink-3)}

.tag.bad{background:var(--bad-bg);color:var(--bad)}

input[type=number]{font-family:var(--mono);text-align:right}

textarea{font-family:var(--mono);font-size:11.5px;line-height:1.45;resize:vertical;min-height:130px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  font:inherit;font-size:13px;font-weight:550;padding:7px 14px;border-radius:7px;cursor:pointer;

.row{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}

.row .grow{flex:1 1 190px;min-width:0}

.chart{width:100%;height:auto;display:block;overflow:visible}

const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');

function buildMap(headers, dict){
  const map = {};
  headers.forEach((h, i) => {
    const n = norm(h);
    for (const [canon, alts] of Object.entries(dict)){
      if (map[canon] !== undefined) continue;
      if (alts.includes(n)) { map[canon] = i; break; }
    }
  });
  return map;
}

/* ---------- delimited parsing (CSV or TSV, quote-aware) ---------- */
function parseDelimited(text){
  text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').trim();
  if (!text) return [];
  const head = text.slice(0, text.indexOf('\n') < 0 ? text.length : text.indexOf('\n'));
  const delim = (head.split('\t').length > head.split(',').length) ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  row.push(cell); rows.push(row);
  return rows.filter(r => r.some(v => String(v).trim() !== ''));
}

const toNum = v => {
  if (v === null || v === undefined) return 0;
  const n = parseFloat(String(v).replace(/[$,\s%]/g, ''));
  return isFinite(n) ? n : 0;

function seed(){

function load(){

    return {...base, ...v, settings:{...base.settings, ...(v.settings||{})},
            estimate:{...base.estimate, ...(v.estimate||{})}};
  } catch(e){ return seed(); }
}

/* ===================== formatting ===================== */
const fmtM  = n => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtM0 = n => (n<0?'-':'') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
const fmtN  = n => Math.round(n).toLocaleString('en-US');
const fmtN2 = n => n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtP  = n => (n*100).toFixed(1) + '%';
const fmtR  = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:n<0.01?6:4,maximumFractionDigits:6});
const esc   = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===================== derived model ===================== */
function rateFor(sku){
  const r = S.skus.find(x => x.sku === sku);
  return r ? r.list_rate * (1 - S.settings.discount) : 0;
}
function classFor(sku){
  const r = S.skus.find(x => x.sku === sku);
  return r ? r.billing_class : 'Unknown';
}
function daysIn(p){ const [y,m] = p.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function daysElapsed(){
  const d = new Date(S.settings.as_at + 'T00:00:00');
  return isNaN(d) ? 1 : Math.max(1, d.getDate());
}

function compute(){
  const st = S.settings;
  const dim = daysIn(st.period), de = Math.min(daysElapsed(), dim);

  // ---- AI credit pool
  const poolUtil   = st.pool_entitlement ? st.pool_consumed / st.pool_entitlement : 0;
  const runRate    = st.pool_consumed / de;
  const projected  = runRate * dim;
  const projUtil   = st.pool_entitlement ? projected / st.pool_entitlement : 0;
  const projOver   = Math.max(0, projected - st.pool_entitlement);
  const projSpend  = projOver * st.credit_price;

  // ---- AI by cost centre
  const aiCredits  = S.centres.reduce((a,c) => a + (+c.included_credits||0), 0);
  const aiGross    = S.centres.reduce((a,c) => a + (+c.gross_amount||0), 0);
  const aiOitGross = S.centres.filter(c=>c.funding_tier==='OIT').reduce((a,c)=>a+(+c.gross_amount||0),0);
  const aiOuGross  = aiGross - aiOitGross;

  // ---- usage rollups (GitHub schema fields)
  const byClass = {Seat:0, Metered:0, AI:0, Unknown:0};
  const byProduct = {}, byCentre = {};
  let gross = 0, discount = 0, net = 0, checkFails = 0;
  S.usage.forEach(u => {
    const cls = classFor(u.sku);
    byClass[cls] = (byClass[cls]||0) + (+u.net_amount||0);
    byProduct[u.product] = (byProduct[u.product]||0) + (+u.net_amount||0);
    const cc = u.cost_center_name || '(unallocated)';
    byCentre[cc] = byCentre[cc] || {Seat:0, Metered:0, AI:0};
    byCentre[cc][cls === 'Unknown' ? 'Metered' : cls] += (+u.net_amount||0);
    gross += (+u.gross_amount||0); discount += (+u.discount_amount||0); net += (+u.net_amount||0);
    const expect = (+u.quantity||0) * (+u.applied_cost_per_quantity||0);
    if (Math.abs(expect - (+u.gross_amount||0)) > 0.05) checkFails++;
  });

  // ---- per-user budgets
  const trigAmt = st.ent_default_budget * st.trigger_pct;
  const users = S.users.map(u => {
    const budget = +u.effective_budget || 0;
    const mtd = +u.mtd_spend || 0;
    const pct = budget ? mtd / budget : 0;
    const status = pct >= 1 ? 'At/over 100%' : pct >= 0.9 ? '90-99%' : pct >= 0.8 ? '80-89%' : 'Normal';
    return {...u, pct, remaining: budget - mtd,
            aic_quantity: st.credit_price ? mtd / st.credit_price : 0,
            status,
            trigger: budget <= st.ent_default_budget && mtd >= trigAmt,
            has_team: !!String(u.enterprise_teams||'').trim()};
  });
  const over100 = users.filter(u=>u.status==='At/over 100%').length;
  const b90 = users.filter(u=>u.status==='90-99%').length;
  const b80 = users.filter(u=>u.status==='80-89%').length;
  const noTeam = users.filter(u=>!u.has_team).length;
  const triggered = users.filter(u=>u.trigger).length;
  const userMtd = users.reduce((a,u)=>a+(+u.mtd_spend||0),0);
  const user28 = users.reduce((a,u)=>a+(+u.spend_28d||0),0);

  const targetBudget = (S.centres.find(c=>c.cost_center_name==='Power Users')||{}).ai_credit_budget || 0;
  const uplift = Math.max(0, targetBudget - st.ent_default_budget);
  const exposure = (+st.automation_uplifted||0) * uplift;

  // ---- chargeback
  const chargeback = S.centres.map(c => {
    const u = byCentre[c.cost_center_name] || {Seat:0, Metered:0, AI:0};
    const total = u.Seat + u.Metered + (+c.gross_amount||0);
    const budget = +c.monthly_budget || 0;
    return {...c, seat:u.Seat, metered:u.Metered, ai:+c.gross_amount||0, total, budget,
            pctBudget: budget ? total/budget : 0,
            status: !budget ? 'No budget set' : total > budget ? 'Over budget'
                    : total > 0.9*budget ? 'Near limit' : 'Within budget'};
  });
  const unalloc = (byCentre['(unallocated)'] || {Seat:0,Metered:0,AI:0});
  const unallocTotal = unalloc.Seat + unalloc.Metered + unalloc.AI;

  const billed = byClass.Seat + byClass.Metered + st.additional_usage;

  return {dim, de, poolUtil, runRate, projected, projUtil, projOver, projSpend,
          aiCredits, aiGross, aiOitGross, aiOuGross, byClass, byProduct, byCentre,
          gross, discount, net, checkFails, users, over100, b90, b80, noTeam, triggered,
          userMtd, user28, trigAmt, uplift, exposure, chargeback, unallocTotal, billed};
}

/* ===================== small chart helpers ===================== */
function barChart(rows, opts){
  opts = opts || {};
  const fmt = opts.fmt || fmtM0;
  const vals = rows.map(r => r.v);
  const max = Math.max(1, ...vals);
  const rowH = 24, padL = opts.padL || 160, padR = 80, w = 640;
  const h = rows.length * rowH + 8;
  let out = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opts.title||'chart')}">`;
  rows.forEach((r, i) => {
    const y = i * rowH + 4, bw = Math.max(1, (r.v / max) * (w - padL - padR));
    const col = r.color || 'var(--accent)';
    out += `<text class="lbl" x="${padL-8}" y="${y+12}" text-anchor="end">${esc(r.k)}</text>`;
    out += `<rect x="${padL}" y="${y+2}" width="${bw}" height="13" rx="2.5" fill="${col}"/>`;
    out += `<text class="v" x="${padL+bw+7}" y="${y+13}">${fmt(r.v)}</text>`;
  });
  return out + '</svg>';
}
function poolGauge(util, projUtil){
  const w = 640, h = 44, bh = 16, y = 12;
  const fill = Math.min(1, Math.max(0, util)) * w;
  const proj = Math.min(1, Math.max(0, projUtil)) * w;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="AI credit pool">
    <rect class="gauge-track" x="0" y="${y}" width="${w}" height="${bh}" rx="8"/>
    <rect class="gauge-fill"  x="0" y="${y}" width="${fill}" height="${bh}" rx="8"/>
    <line class="gauge-proj" x1="${proj}" y1="${y-6}" x2="${proj}" y2="${y+bh+6}"/>
    <text class="v" x="4" y="9">${fmtP(util)} used</text>
    <text class="v" x="${w-4}" y="9" text-anchor="end">${fmtP(projUtil)} projected</text>
  </svg>`;
}

/* ---------- Estimator ---------- */
function viewEstimate(){
  const e = S.estimate, st = S.settings;
  const allow = PLAN_ALLOWANCE[e.plan] || {};
  const seatRows = Object.keys(e.seats).map(sku => {
    const qty = +e.seats[sku]||0, rate = rateFor(sku);
    return {sku, qty, rate, cost: qty*rate, credits: (CREDITS_PER_SEAT[sku]||0)*qty};
  });
  const pool = seatRows.reduce((a,r)=>a+r.credits,0);
  const usageRows = Object.keys(e.usage).map(sku => {
    const qty = +e.usage[sku]||0;
    const inc = sku === 'copilot_ai_credit' ? pool : (allow[sku]||0);
    const billable = Math.max(0, qty - inc), rate = rateFor(sku);
    return {sku, qty, inc, billable, rate, cost: billable*rate};
  });
  const seatTotal = seatRows.reduce((a,r)=>a+r.cost,0);
  const usageTotal = usageRows.reduce((a,r)=>a+r.cost,0);
  const cont = usageTotal * (+e.contingency||0);

  return `

          <td class="num">${fmtN(pool)}</td></tr></tbody></table></div>

/* ---------- editable table helper ---------- */
function editTable(coll, cols, opts){
  opts = opts || {};
  const rows = S[coll];
  const numCols = cols.filter(c => c[2]==='num' || c[2]==='money').map(c=>c[0]);
  const totals = {};
  numCols.forEach(f => totals[f] = rows.reduce((a,r)=>a+(+r[f]||0),0));
  return `<div class="tw"><table>
    <thead><tr>${cols.map(c=>`<th class="${c[2]==='num'||c[2]==='money'?'num':''}">${esc(c[1])}</th>`).join('')}
      ${opts.extraHead?`<th>${esc(opts.extraHead)}</th>`:''}
      ${opts.remove?'<th></th>':''}</tr></thead>
    <tbody>${rows.map((r,i)=>`<tr class="${opts.oit&&r.funding_tier==='OIT'?'oitrow':''}">
      ${cols.map(c=>{
        const [f,,type,ro] = c;
        if (type==='tier') return `<td><select data-coll="${coll}" data-i="${i}" data-f="${f}">
          <option ${r[f]==='OIT'?'selected':''}>OIT</option>
          <option ${r[f]==='OU'?'selected':''}>OU</option></select></td>`;
        if (type==='text') return ro
          ? `<td>${esc(r[f])}</td>`
          : `<td><input type="text" value="${esc(r[f])}" data-coll="${coll}" data-i="${i}" data-f="${f}"></td>`;
        const step = type==='money' ? '0.01' : '0.01';
        return `<td class="num"><input type="number" step="${step}" value="${+r[f]||0}"
          data-coll="${coll}" data-i="${i}" data-f="${f}" style="width:120px"></td>`;
      }).join('')}
      ${opts.extraHead?`<td>${opts.extra(r)}</td>`:''}
      ${opts.remove?`<td><button class="btn sm" data-del="${coll}" data-i="${i}">Remove</button></td>`:''}
    </tr>`).join('')}
    ${opts.total?`<tr class="total">${cols.map((c,j)=>{
      const [f,,type] = c;
      if (j===0) return '<td>Total</td>';
      if (type==='num') return `<td class="num">${fmtN2(totals[f])}</td>`;
      if (type==='money') return `<td class="num">${fmtM(totals[f])}</td>`;
      return '<td></td>';
    }).join('')}${opts.extraHead?'<td></td>':''}${opts.remove?'<td></td>':''}</tr>`:''}
    </tbody></table></div>`;
}
function num(field, label, val, coll, step){
  return `<div class="grow"><label class="fld">${esc(label)}</label>
    <input type="number" step="${step||1}" value="${val}" data-coll="${coll}" data-f="${field}"></div>`;
}
function txt(field, label, val, coll){
  return `<div class="grow"><label class="fld">${esc(label)}</label>
    <input type="text" value="${esc(val)}" data-coll="${coll}" data-f="${field}"></div>`;
}

/* ===================== export ===================== */
function toCSV(rows, cols){
  const q = v => {
    const s = String(v==null?'':v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  return [cols.join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\n');
}
async function download(filename, text){
  try {
    const dl = await claude.use('downloads');
    if (dl) { await dl.save({filename, data: text}); return; }
  } catch(e){}
  try {
    const blob = new Blob([text], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  } catch(e){ alert('Download is not available in this view.'); }
}

/* ===================== wiring ===================== */
function render(){
  const d = compute();
  renderChrome();
  renderTabs();
  const map = {
    overview: viewOverview, ai: viewAI, usage: viewUsage, users: viewUsers,
    centres: viewCentres, chargeback: viewChargeback, rates: viewRates, estimate: viewEstimate
  };
  TABS.forEach(([id]) => {
    const el = document.getElementById('p-' + id);
    el.hidden = id !== active;
    if (id === active) el.innerHTML = map[id](d);
  });
  window.scrollTo({top:0});
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab){ active = tab.dataset.tab; render(); return; }

  const del = e.target.closest('[data-del]');
  if (del){ S[del.dataset.del].splice(+del.dataset.i, 1); save(); render(); return; }

  const id = e.target.id;
  if (!id) return;

  if (id === 'btnTheme'){
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
    if (next) document.documentElement.setAttribute('data-theme', next);
    else document.documentElement.removeAttribute('data-theme');
    return;
  }
  if (id === 'btnReset'){
    if (confirm('Clear everything stored in this browser and reload the seeded data?')){
      localStorage.removeItem(KEY); S = seed(); render();
    }
    return;
  }

  if (id === 'btnImportUsage' || id === 'btnAppendUsage'){
    const rows = parseDelimited(document.getElementById('usagePaste').value);
    const msg = document.getElementById('importMsg');
    if (rows.length < 2){ msg.textContent = 'Nothing to import — paste the CSV including its header row.'; return; }
    const map = buildMap(rows[0], USAGE_FIELDS);
    if (map.sku === undefined){ msg.textContent = 'No sku column found. Check the header row.'; return; }
    const out = rows.slice(1).map(r => {
      const o = {};
      Object.keys(USAGE_FIELDS).forEach(f => { o[f] = map[f] !== undefined ? (r[map[f]]||'').trim() : ''; });
      ['quantity','applied_cost_per_quantity','gross_amount','discount_amount','net_amount','aic_quantity']
        .forEach(f => o[f] = toNum(o[f]));
      if (!o.net_amount && o.gross_amount) o.net_amount = o.gross_amount - o.discount_amount;
      o.exceeds_quota = toBool(o.exceeds_quota);
      return o;
    }).filter(o => o.sku);
    S.usage = id === 'btnAppendUsage' ? S.usage.concat(out) : out;
    save();
    const missing = Object.keys(USAGE_FIELDS).filter(f => map[f] === undefined);
    msg.textContent = `Imported ${out.length} rows.` + (missing.length ? ` Columns not present: ${missing.join(', ')}.` : '');
    render(); return;
  }
  if (id === 'btnClearUsage'){ S.usage = []; save(); render(); return; }

  if (id === 'btnImportUsers'){
    const rows = parseDelimited(document.getElementById('userPaste').value);
    const msg = document.getElementById('userMsg');
    if (rows.length < 2){ msg.textContent = 'Nothing to import — include the header row.'; return; }
    const map = buildMap(rows[0], USER_FIELDS);
    if (map.username === undefined){ msg.textContent = 'No GitHub Login column found.'; return; }
    const out = rows.slice(1).map(r => {
      const g = f => map[f] !== undefined ? (r[map[f]]||'').trim() : '';
      return {username:g('username'), enterprise_teams:g('enterprise_teams'),
              cost_center_name:g('cost_center_name'),
              effective_budget:toNum(g('effective_budget')), budget_source:g('budget_source'),
              mtd_spend:toNum(g('mtd_spend')), spend_28d:toNum(g('spend_28d')),
              active_days:toNum(g('active_days')), last_active:g('last_active'),
              interactions:toNum(g('interactions')), used_agent:toBool(g('used_agent')),
              used_chat:toBool(g('used_chat')), ides:g('ides')};
    }).filter(o => o.username);
    S.users = out; save();
    msg.textContent = `Imported ${out.length} users.`;
    render(); return;
  }
  if (id === 'btnClearUsers'){ S.users = []; save(); render(); return; }
  if (id === 'btnAddCentre'){
    S.centres.push({cost_center_name:'New cost centre', scope_type:'Enterprise Team',
      scope_detail:'', funding_tier:'OU', ai_credit_budget:0, monthly_budget:0,
      included_credits:0, additional_credits:0, gross_amount:0, additional_usage:0,
      pool_used:0, pool_limit:0});
    save(); render(); return;
  }

  const d = compute();
  if (id === 'btnExportUsage')
    download(`github_usage_${S.settings.period}.csv`,
      toCSV(S.usage, ['date','product','sku','quantity','unit_type','applied_cost_per_quantity',
        'gross_amount','discount_amount','net_amount','organization','repository','username','cost_center_name']));
  if (id === 'btnExportUsers')
    download(`copilot_user_budgets_${S.settings.period}.csv`,
      toCSV(d.users.map(u=>({...u, pct_of_budget:(u.pct*100).toFixed(1)+'%'})),
        ['username','enterprise_teams','cost_center_name','effective_budget','budget_source',
         'mtd_spend','pct_of_budget','remaining','spend_28d','aic_quantity','active_days',
         'last_active','interactions','used_agent','used_chat','ides','status']));
  if (id === 'btnExportCentres')
    download('github_cost_centers.csv',
      toCSV(S.centres, ['cost_center_name','scope_type','scope_detail','funding_tier',
        'ai_credit_budget','monthly_budget','included_credits','additional_credits',
        'gross_amount','additional_usage','pool_used','pool_limit']));
  if (id === 'btnExportRates')
    download('github_sku_rate_card.csv',
      toCSV(S.skus.map(s=>({...s, applied_cost_per_quantity:+(s.list_rate*(1-S.settings.discount)).toFixed(6)})),
        ['product','sku','description','unit_type','billing_class','list_rate','applied_cost_per_quantity']));
  if (id === 'btnExportCb')
    download(`github_chargeback_${S.settings.period}.csv`,
      toCSV(d.chargeback.map(c=>({cost_center_name:c.cost_center_name, funding_tier:c.funding_tier,
        seat_spend:c.seat.toFixed(2), metered_spend:c.metered.toFixed(2), ai_gross_amount:c.ai.toFixed(2),
        total:c.total.toFixed(2), monthly_budget:c.budget, status:c.status})),
        ['cost_center_name','funding_tier','seat_spend','metered_spend','ai_gross_amount','total','monthly_budget','status']));
  if (id === 'btnExportEst'){
    const e = S.estimate;
    const rows = Object.keys(e.seats).map(sku=>({type:'seat', sku, quantity:e.seats[sku],
        applied_cost_per_quantity:rateFor(sku).toFixed(6),
        monthly_cost:((+e.seats[sku]||0)*rateFor(sku)).toFixed(2)}))
      .concat(Object.keys(e.usage).map(sku=>({type:'metered', sku, quantity:e.usage[sku],
        applied_cost_per_quantity:rateFor(sku).toFixed(6),
        monthly_cost:(Math.max(0,(+e.usage[sku]||0))*rateFor(sku)).toFixed(2)})));
    download('github_cost_estimate.csv', toCSV(rows,
      ['type','sku','quantity','applied_cost_per_quantity','monthly_cost']));
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.est){
    S.estimate[t.dataset.est][t.dataset.f] = toNum(t.value);
    save(); scheduleRender(); return;
  }
  const coll = t.dataset.coll, f = t.dataset.f;
  if (!coll || !f) return;
  const val = t.type === 'number' ? toNum(t.value) : t.value;
  if (t.dataset.i !== undefined) S[coll][+t.dataset.i][f] = val;
  else if (coll === 'settings' || coll === 'estimate') S[coll][f] = val;
  save(); scheduleRender();
});
document.addEventListener('change', e => {
  if (e.target.tagName === 'SELECT') {
    const t = e.target, coll = t.dataset.coll, f = t.dataset.f;
    if (!coll || !f) return;
    if (t.dataset.i !== undefined) S[coll][+t.dataset.i][f] = t.value;
    else S[coll][f] = t.value;
    save(); render();
  }
});

/* rerender without stealing focus from the field being typed in */
let rt;
function scheduleRender(){
  clearTimeout(rt);
  rt = setTimeout(() => {
    const a = document.activeElement;
    const key = a && a.dataset ? [a.dataset.coll, a.dataset.i, a.dataset.f, a.dataset.est].join('|') : null;
    const pos = a && a.selectionStart;
    render();
    if (key){
      const sel = [...document.querySelectorAll('input,select')].find(el =>
        [el.dataset.coll, el.dataset.i, el.dataset.f, el.dataset.est].join('|') === key);
      if (sel){ sel.focus(); try { sel.setSelectionRange(pos, pos); } catch(err){} }
    }
  }, 420);
}

S = load();
render();
</script>
